spring:
  application:
      name: PetPar
  flyway:
    baseline-on-migrate: true
  jpa:
    database: MYSQL
    show-sql: true
  datasource:
    url: "jdbc:mysql://localhost:3306/PetPar?createDatabaseIfNotExist=true&useSSL=false&useTimezone=true&serverTimezone=UTC&allowPublicKeyRetrieval=true"
    username: "root"
    password: "root"

  jackson:
    deserialization:
      fail-on-unknown-properties: true
