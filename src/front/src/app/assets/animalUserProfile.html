<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Perfil do Animal</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/animalProfileUser.css">
</head>
<body>
<!-- NavBar -->
<nav class="navbar" style="background-color: #cb8c63; box-shadow: 3px 3px 5px rgba(0, 0, 0, 0.4); padding: 10px;">
    <div class="container-fluid d-flex align-items-center justify-content-between">
        <a class="navbar-brand" href="home.html">
            <img alt="logo" src="img/logoPetPar.png" style="max-width: 150px;">
        </a>
        <ul class="navbar-nav d-flex flex-row align-items-center" style="gap: 20px; list-style: none; margin: 0; padding: 0;">
            <li class="nav-item active">
                <a href="userAnimalList.html" class="nav-link" style="text-decoration: none; color: white;">Lista de Pets</a>
            </li>
            <li class="nav-item">
                <a href="animalUserProfile.html" class="nav-link" style="text-decoration: none; color: white;">Andamento da adoção</a>
            </li>
            <li class="nav-item">
                <a href="donationUserList.html" class="nav-link" style="text-decoration: none; color: white;"href="#">Faça uma doação!</a>
            </li>
            <li class="nav-item">
                <a class="nav-link" href="ControllerServlet?action=logout" style="text-decoration: none; color: white;">Logout</a>
            </li>
        </ul>
    </div>
</nav>

<div class="container my-5">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card shadow-lg">
                <div class="card-header bg-custom-header text-white text-center">
                    <h3>${animal.name}</h3>
                </div>
                <div class="card-body bg-custom-body">
                    <div class="text-center mb-4">
                        <img src="img/animal_image.jpg" alt="Foto do Animal" class="img-fluid rounded">
                    </div>
                    <ul class="list-group">
                        <li class="list-group-item">Nome: ${animal.name}</li>
                        <li class="list-group-item">Descrição: ${animal.description}</li>
                        <li class="list-group-item">Gênero: ${animal.gender}</li>
                        <li class="list-group-item">Data de Nascimento: ${animal.birthDate}</li>
                        <li class="list-group-item">Tipo: ${animal.type}</li>
                    </ul>
                    <form action="ControllerServlet" method="post" id="form1" class="mt-4">
                        <input type="hidden" name="id" id="id" value="${animal.id}">
                        <button type="submit" class="btn btn-custom w-100" name="action" value="userAdoption">Solicitar Adoção</button>
                    </form>
                    <br></br>
                    <a href="userAnimalList.html" class="btn btn-custom w-100">Voltar</a>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
