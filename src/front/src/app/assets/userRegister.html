<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Cadastro de Adotante</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="css/cadastro.css">
</head>
<body>
<!-- NavBar -->
<nav class="navbar" style="background-color: #cb8c63; box-shadow: 3px 3px 5px rgba(0, 0, 0, 0.4); padding: 10px;">
    <div class="container-fluid d-flex align-items-center justify-content-between">
        <a class="navbar-brand" href="home.html">
            <img alt="logo" src="img/logoPetPar.png" style="max-width: 150px;">
        </a>
        <ul class="navbar-nav d-flex flex-row align-items-center" style="gap: 20px; list-style: none; margin: 0; padding: 0;">
            <li class="nav-item">
                <a href="home.html" class="nav-link" style="text-decoration: none; color: white;">Início</a>
            </li>
            <li class="nav-item">
                <a href="userLogin.html" class="nav-link" style="text-decoration: none; color: white;">Quero adotar</a>
            </li>
            <li class="nav-item">
                <a href="institutionLogin.html" class="nav-link" style="text-decoration: none; color: white;">Faça Parte</a>
            </li>
            <li class="nav-item">
                <a href="contato.html" class="nav-link" style="text-decoration: none; color: white;">Contato</a>
            </li>
        </ul>
    </div>
</nav>

<div class="cadastro-container">
    <form action="ControllerServlet" method="post" id="registerForm">
        <fieldset>
            <legend>Cadastro de Adotante</legend>
            <div class="inputBox">
                <label for="nome">Nome:</label>
                <input type="text" id="name" name="name" required>
            </div>
            <div class="inputBox">
                <label for="email">Email:</label>
                <input type="email" id="email" name="email" required>
            </div>
            <div class="inputBox">
                <label for="senha">Senha:</label>
                <input type="password" id="senha" name="senha" required>
            </div>
            <div class="inputBox">
                <label for="dataNascimento">Data de Nascimento:</label>
                <input type="date" id="dateOfBirth" name="dateOfBirth" required>
            </div>
            <div class="inputBox">
                <label for="cpf">CPF:</label>
                <input type="text" id="cpf" name="cpf" required>
            </div>
            <div class="inputBox">
                <label for="telefone">Número de Telefone:</label>
                <input type="text" id="phoneNumber" name="phoneNumber" required>
            </div>
            <div class="inputBox">
                <label for="genero">Gênero:</label>
                <select id="genero" name="gender" required>
                    <option value="" disabled selected>Selecione</option>
                    <option value="MASCULINO">Masculino</option>
                    <option value="FEMININO">Feminino</option>
                    <option value="OUTRO">Outro</option>
                </select>
            </div>
            <button type="submit" name="action" value="addUser">Cadastrar</button>
        </fieldset>
    </form>
    <p class="text-white">Já tem uma conta? <a href="userLogin.html">Faça login</a></p>
</div>
<script
		src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"></script>
	<script src="js/register.js"></script>
</body>
</html>
