<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contato - PetPar</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/donations.css">
</head>
<body>

<!-- NavBar -->
<nav class="navbar" style="background-color: #cb8c63; box-shadow: 3px 3px 5px rgba(0, 0, 0, 0.4); padding: 10px;">
    <div class="container-fluid d-flex align-items-center justify-content-between">
        <a class="navbar-brand" href="home.html">
            <img alt="logo" src="img/logoPetPar.png" style="max-width: 150px;">
        </a>
        <ul class="navbar-nav d-flex flex-row align-items-center" style="gap: 20px; list-style: none; margin: 0; padding: 0;">
            <li class="nav-item">
                <a href="home.html" class="nav-link" style="text-decoration: none; color: white;">Início</a>
            </li>
            <li class="nav-item">
                <a href="userLogin.html" class="nav-link" style="text-decoration: none; color: white;">Quero adotar</a>
            </li>
            <li class="nav-item">
                <a href="institutionLogin.html" class="nav-link" style="text-decoration: none; color: white;">Faça Parte</a>
            </li>
            <li class="nav-item">
                <a href="contato.html" class="nav-link" style="text-decoration: none; color: white;">Contato</a>
            </li>
        </ul>
    </div>
</nav>

<div class="container contact-container" style="background-color: rgba(0, 0, 0, 0.6); border-radius: 30px; padding: 20px; box-shadow: 3px 3px 5px rgba(0, 0, 0, 0.3)">
    <div class="contact-header">
        <h2>Fale Conosco</h2>
        <p>Entre em contato com a equipe de desenvolvedores da PetPar</p>
    </div>
    <form>
        <div class="mb-3">
            <label for="name" class="form-label">Nome Completo</label>
            <input type="text" class="form-control" id="name" placeholder="Seu nome">
        </div>
        <div class="mb-3">
            <label for="email" class="form-label">E-mail</label>
            <input type="email" class="form-control" id="email" placeholder="seuemail@exemplo.com">
        </div>
        <div class="mb-3">
            <label for="subject" class="form-label">Assunto</label>
            <input type="text" class="form-control" id="subject" placeholder="Assunto do contato">
        </div>
        <div class="mb-3">
            <label for="message" class="form-label">Mensagem</label>
            <textarea class="form-control" id="message" rows="5" placeholder="Sua mensagem"></textarea>
        </div>
        <button type="submit" class="btn btn-custom btn-lg w-100">Enviar</button>
    </form>
</div>

<br></br>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
