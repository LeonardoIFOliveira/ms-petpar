<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PetPar - Encontre seu novo amigo</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="css/x.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Jost:wght@500;600&display=swap" rel="stylesheet">
</head>
<body>
<!-- NavBar -->
<nav class="navbar" style="background-color: #cb8c63; box-shadow: 3px 3px 5px rgba(0, 0, 0, 0.4); padding: 10px;">
    <div class="container-fluid d-flex align-items-center justify-content-between">
        <a class="navbar-brand" href="#">
            <img alt="logo" src="img/logoPetPar.png" style="max-width: 150px;">
        </a>
        <ul class="navbar-nav d-flex flex-row align-items-center" style="gap: 20px; list-style: none; margin: 0; padding: 0;">
            <li class="nav-item">
                <a href="home.html" class="nav-link" style="text-decoration: none; color: white;">Início</a>
            </li>
            <li class="nav-item">
                <a href="userLogin.html" class="nav-link" style="text-decoration: none; color: white;">Quero adotar</a>
            </li>
            <li class="nav-item">
                <a href="institutionLogin.html" class="nav-link" style="text-decoration: none; color: white;">Faça Parte</a>
            </li>
            <li class="nav-item">
                <a href="contato.html" class="nav-link" style="text-decoration: none; color: white;">Contato</a>
            </li>
        </ul>
    </div>
</nav>

<!-- Carousel -->
<div id="carouselExampleAutoplaying" class="carousel slide" data-bs-ride="carousel">
    <div class="carousel-inner">
        <div class="carousel-item active">
            <img src="img/banner.svg" class="d-block w-100" alt="Adotar">
        </div>
        <div class="carousel-item">
            <img src="img/Institutes.svg" class="d-block w-100" alt="Instituicoes">
        </div>
        <div class="carousel-item">
            <img src="img/Doacao.svg" class="d-block w-100" alt="Faça Parte">
        </div>
    </div>
    <button class="carousel-control-prev" type="button" data-bs-target="#carouselExampleAutoplaying" data-bs-slide="prev">
        <span class="carousel-control-prev-icon" aria-hidden="true"></span>
        <span class="visually-hidden">Previous</span>
    </button>
    <button class="carousel-control-next" type="button" data-bs-target="#carouselExampleAutoplaying" data-bs-slide="next">
        <span class="carousel-control-next-icon" aria-hidden="true"></span>
        <span class="visually-hidden">Next</span>
    </button>
</div>


<div class="container-fluid vh-100 d-flex align-items-center justify-content-center bg-custom">
    <div class="row w-100">
        <div class="col-md-6 d-flex justify-content-center align-items-center">
            <img src="img/PAR.png" alt="Pets" class="img- fluid pets-image">
        </div>
        <div class="col-md-6 d-flex flex-column justify-content-center align-items-center text-white">
            <h1 class="display-3 font-weight-bold" style="font-family: 'Jost', sans-serif;">PetPar</h1>
            <p class="lead">Encontre seu novo amigo aqui!</p>
            <div class="btn-container">
                <a href="userLogin.html" class="btn btn-adopt btn-lg mb-3 btn-custom">Quero adotar</a>
                <a href="institutionLogin.html" class="btn btn-institution btn-lg btn-custom">Sou uma instituição</a>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
