<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Perfil do Animal - Instituição</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="css/animalProfileInstitution.css">
</head>
<body>
<!-- NavBar -->
<nav class="navbar" style="background-color: #cb8c63; box-shadow: 3px 3px 5px rgba(0, 0, 0, 0.4); padding: 10px;">
    <div class="container-fluid d-flex align-items-center justify-content-between">
        <a class="navbar-brand" href="home.html">
            <img alt="logo" src="img/logoPetPar.png" style="max-width: 150px;">
        </a>
        <ul class="navbar-nav d-flex flex-row align-items-center" style="gap: 20px; list-style: none; margin: 0; padding: 0;">
            <li class="nav-item">
                <a href="institutionAnimalList.html" class="nav-link" style="text-decoration: none; color: white;">Lista de Pets</a>
            </li>
            <li class="nav-item">
                <a href="institutionAnimalRegister.html" class="nav-link" style="text-decoration: none; color: white;">Cadastro de Pets</a>
            </li>
            <li class="nav-item">
                <a href="donationInstitutionList.html" class="nav-link" style="text-decoration: none; color: white;">Lista de Doações</a>
            </li>
            <li class="nav-item">
                <a href="ControllerServlet?action=logout" class="nav-link" style="text-decoration: none; color: white;">Logout</a>
            </li>
        </ul>
    </div>
</nav>


<div class="cadastro-container" style="background-color: rgba(0, 0, 0, 0.7);">
    <form action="ControllerServlet" method="post">
        <fieldset>
            <legend style="color: white;">Perfil do Animal - Instituição</legend>
            <div class="inputBox">
                <label for="name">Nome do Animal:</label>
                <input type="text" id="name" name="name" value="${animal.name}" required>
            </div>
            <div class="inputBox">
                <label for="description">Descrição:</label>
                <textarea id="description" name="description" rows="3" required>${animal.description}</textarea>
            </div>
            <div class="inputBox">
                <label for="statusAdoption">Gênero:</label>
                <select id="statusAdoption" name="statusAdoption"  required>
                    <option value="${animal.statusAdoption}" selected>${animal.statusAdoption}</option>
                    <option value="IN_PROGRESS">Diponivel</option>
                    <option value="PENDING">Pendente</option>
                    <option value="DONE">Adotado</option>
                </select>
            </div>
            <div class="inputBox">
                <label for="gender">Gênero:</label>
                <select id="gender" name="gender"  required>
                    <option value="${animal.gender}" selected>${animal.gender}</option>
                    <option value="MASCULINO">Masculino</option>
                    <option value="FEMININO">Feminino</option>
                </select>
            </div>
            <div class="inputBox">
                <label for="birth_date" >Data de Nascimento:</label>
                <input type="date" id="birthDate" name="birthDate" value="${animal.birthDate}" required>
            </div>
            <div class="inputBox">
                <label for="type">Tipo:</label>
                <select id="type" name="type" value="${animal.type}" required>
                    <option value="${animal.type}" selected>${animal.type}</option>
                    <option value="CACHORRO">Cachorro</option>
                    <option value="GATO">Gato</option>
                    <option value="ROEDOR">Roedor</option>
                    <option value="PEIXE">Peixe</option>
                </select>
            </div>
            <div class="inputBox">
                <label for="photo">Foto do Animal:</label>
                <input type="file" id="photo" name="photo" required>
            </div>

            <div class="d-flex justify-content-between mt-4">
                <input type="hidden" name="id" id="id" value="${animal.id}">
                <input type="hidden" name="user" id="user" value="${animal.user.id}">
                <input type="hidden" name="institution" id="institution" value="${animal.institution.id}">
                <!-- Botão Salvar Perfil -->
                <button type="submit" class="btn btn-success" name="action" value="animalUpdate">Salvar</button>

                <!-- Botão Cancelar -->
                <a href="institutionAnimalList.html" class="btn btn-secondary">Cancelar</a>

                <!-- Botão Eliminar Animal -->
                <button type="submit" class="btn btn-danger" name="action" value="animalDelete">Deletar</button>
            </div>
        </fieldset>
    </form>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/animalProfile.js"></script>
</body>
</html>
