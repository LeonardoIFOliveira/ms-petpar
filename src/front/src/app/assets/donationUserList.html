<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <title>Animais para Adoção - PetPar</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="css/cadastro.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet">
</head>
<body>
<!-- NavBar -->
<nav class="navbar" style="background-color: #cb8c63; box-shadow: 3px 3px 5px rgba(0, 0, 0, 0.4); padding: 10px;">
    <div class="container-fluid d-flex align-items-center justify-content-between">
        <a class="navbar-brand" href="#">
            <img alt="logo" src="img/logoPetPar.png" style="max-width: 150px;">
        </a>
        <ul class="navbar-nav d-flex flex-row align-items-center" style="gap: 20px; list-style: none; margin: 0; padding: 0;">
            <li class="nav-item active">
                <a href="userAnimalList.html" class="nav-link" href="#" style="text-decoration: none; color: white;">Lista de Pets</a>
            </li>
            <li class="nav-item">
                <a href="animalUserProfile.html" class="nav-link" href="#" style="text-decoration: none; color: white;">Andamento da adoção</a>
            </li>
            <li class="nav-item">
                <a href="donationUserList.html" class="nav-link" href="#" style="text-decoration: none; color: white;">Faça uma doação!</a>
            </li>
            <li class="nav-item">
                <a class="nav-link" href="ControllerServlet?action=logout" style="text-decoration: none; color: white;">Logout</a>
            </li>
        </ul>
    </div>
</nav>
	<div class="container" style="margin: 0 auto; width: fit-content;">
		<div class="center col-lg-10 col-sm-12">
			<div class="col-12">
				<h1 class="text-center">Instituições que voce pode doar</h1>
			</div>
            <fieldset>
                <c:choose>
                    <c:when test="${fn:length(institutionList) > 0}">
                        <table class="table table-responsive table-striped table-hover" >
                            <tr>
                                <th>#</th>
                                <th>Nome</th>
                                <th>CPF/CNPJ</th>
                                <th>Número de telefone</th>
                                <th>E-mail</th>
                            </tr>
                            <c:forEach var="institution" items="${institutionList}" varStatus="index">
                                <tr>
                                    <td>${index.count}</td>
                                    <td>${institution.name}</td>
                                    <td>${institution.cpfOrCnpj}</td>
                                    <td>${institution.phoneNumber}</td>
                                    <td>${institution.email}</td>

                                    <td>
                                        <span data-bs-toggle="tooltip" data-bs-placement="top" title="Doar">
                                            <a class="btn" href="ControllerServlet?action=initDonation&id=${institution.id}">
                                                <i class="fas fa-money-bill-wave" alt="Doar"> Doar</i>
                                            </a>
                                        </span>
                                    </td>
                                </tr>
                            </c:forEach>
                        </table>
                    </c:when>
                    <c:otherwise>
                        <c:out value="Sem nenhuma instituição registrada."></c:out>
                    </c:otherwise>
                </c:choose>
			</fieldset>
		</div>
	</div>

	<script
		src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"></script>
	<script type="text/javascript" src="js/home.js"></script>
</body>
</html>
