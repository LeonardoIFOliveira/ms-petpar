<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Cadastro de Adotante</title>
    <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/cadastro.css">
</head>
<body>
<!-- NavBar -->
<nav class="navbar" style="background-color: #cb8c63; box-shadow: 3px 3px 5px rgba(0, 0, 0, 0.4); padding: 10px;">
    <div class="container-fluid d-flex align-items-center justify-content-between">
        <a class="navbar-brand" href="home.html">
            <img alt="logo" src="img/logoPetPar.png" style="max-width: 150px;">
        </a>
        <ul class="navbar-nav d-flex flex-row align-items-center" style="gap: 20px; list-style: none; margin: 0; padding: 0;">
            <li class="nav-item">
                <a href="institutionAnimalList.html" class="nav-link" style="text-decoration: none; color: white;">Lista de Pets</a>
            </li>
            <li class="nav-item">
                <a href="institutionAnimalRegister.html" class="nav-link" style="text-decoration: none; color: white;">Cadastro de Pets</a>
            </li>
            <li class="nav-item">
                <a href="donationInstitutionList.html" class="nav-link" style="text-decoration: none; color: white;">Lista de Doações</a>
            </li>
            <li class="nav-item">
                <a href="ControllerServlet?action=logout" class="nav-link" style="text-decoration: none; color: white;">Logout</a>
            </li>
        </ul>
    </div>
</nav>
        
<div class="cadastro-container">
    <form action="ControllerServlet" method="post">
        <fieldset>
            <legend>Cadastro de Pet</legend>
            <div class="inputBox">
                <label for="nome">Nome:</label>
                <input type="text" id="name" name="name" required>
            </div>
            <div class="inputBox">
                <label for="description">Descrição:</label>
                <input type="description" id="description" name="description" required>
            </div>
            <div class="inputBox">
                <label for="birthDate">Data de Nascimento:</label>
                <input type="date" id="birthDate" name="birthDate" required>
            </div>
            <div class="inputBox">
                <label for="genero">Espécie:</label>
                <select id="type" name="type" required>
                    <option value="" disabled selected>Selecione</option>
                    <option value="CACHORRO">Cachorro</option>
                    <option value="GATO">Gato</option>
                    <option value="ROEDOR">Roedor</option>
                    <option value="PEIXE">Peixe</option>
                    <option value="OUTRO">Outro</option>
                </select>
            </div>
            <div class="inputBox">
                <label for="genero">Gênero:</label>
                <select id="genero" name="gender" required>
                    <option value="" disabled selected>Selecione</option>
                    <option value="MASCULINO">Masculino</option>
                    <option value="FEMININO">Feminino</option>
                    <option value="OUTRO">Outro</option>
                </select>
            </div>
            <button type="submit" name="action" value="addAnimal">Cadastrar</button>
        </fieldset>
    </form>
</div>
</body>
</html>
